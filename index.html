<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMOEBOID</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="assets/fonts/Bombardier-Regular.ttf" as="font" type="font/ttf" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- CRT wave filter -->
  <svg id="crt-filter" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="crt-wave" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.0 0.08"
          numOctaves="1"
          seed="2"
          result="noise">
        </feTurbulence>
        <feDisplacementMap
          in="SourceGraphic"
          in2="noise"
          scale="3"
          xChannelSelector="R"
          yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette"  aria-hidden="true"></div>

  <div class="layout">

    <!-- LEFT: slab monitor -->
    <div class="slab-wrap">
      <div class="slab">

        <div class="slab-bar slab-bar-top">
          <div class="rivet"></div>
          <div class="rivet"></div>
          <div class="slab-label">AMOEBOID — MK.I</div>
          <div class="rivet"></div>
          <div class="rivet"></div>
        </div>

        <div class="slab-body">
          <div class="slab-col">
            <div class="rivet"></div>
            <div class="rivet"></div>
            <div class="rivet"></div>
            <div class="rivet"></div>
          </div>

          <div class="slab-screen-well">
            <div class="slab-screen-inner">
              <div class="screen-flicker" aria-hidden="true"></div>
              <div id="terminal-viewport">
                <div class="terminal-output" id="output" aria-live="polite"></div>
              </div>
              <div class="terminal-input-row" id="input-row" style="display:none;">
                <span class="prompt" aria-hidden="true">runox@amoeboid:~$&nbsp;</span>
                <input
                  type="text"
                  id="cmd-input"
                  class="cmd-input"
                  autocomplete="off"
                  autocorrect="off"
                  autocapitalize="off"
                  spellcheck="false"
                  aria-label="Terminal input"
                />
              </div>
            </div>
          </div>

          <div class="slab-col">
            <div class="rivet"></div>
            <div class="rivet"></div>
            <div class="rivet"></div>
            <div class="rivet"></div>
          </div>
        </div>

        <div class="slab-bar slab-bar-bottom">
          <div class="rivet"></div>
          <div class="rivet"></div>
          <div class="slab-scratches" aria-hidden="true"></div>
          <div class="rivet"></div>
          <div class="rivet"></div>
        </div>

      </div>
    </div>

    <!-- RIGHT: image panel -->
    <div class="right-panel" id="right-panel"></div>

  </div>

  <script src="assets/marked.min.js" defer></script>
  <script src="terminal.js" defer></script>

  <script>
    window.scrollTo = function() {
      var vp = document.getElementById('terminal-viewport');
      if (vp) vp.scrollTop = vp.scrollHeight;
    };
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.retro-window') && !e.target.closest('.entry-card')) {
        var inp = document.getElementById('cmd-input');
        if (inp) inp.focus();
      }
    });

    /* ── Single fetch — shared by marquee and music ── */
    var base = location.pathname.replace(/\/[^/]*$/, '').replace(/\/$/, '');
    var _contentData = null;
    var _contentCallbacks = [];
    fetch(base + '/content.json')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        _contentData = d;
        _contentCallbacks.forEach(function(cb) { cb(d); });
        _contentCallbacks = [];
      })
      .catch(function() { _contentData = {}; });

    function onContent(cb) {
      if (_contentData) cb(_contentData);
      else _contentCallbacks.push(cb);
    }

    /* ── Marquee ── */
    (function() {
      var GAP   = 8;
      var SPEED = 0.5;
      var lastT = 0;

      onContent(function(d) { build(d._panelImages || []); });

      function build(srcs) {
        if (!srcs.length) return;
        var panel = document.getElementById('right-panel');
        var GAP2  = 6;
        var colW  = Math.floor((panel.clientWidth - GAP2 * 3) / 2);
        var cols  = [[], []];
        srcs.forEach(function(s, i) { cols[i % 2].push(s); });

        var strips = cols.map(function(colSrcs, c) {
          var wrap = document.createElement('div');
          wrap.style.cssText = 'position:absolute;top:0;bottom:0;overflow:hidden;left:' + (GAP2 + c*(colW+GAP2)) + 'px;width:' + colW + 'px';
          panel.appendChild(wrap);

          var strip = document.createElement('div');
          strip.style.cssText = 'position:absolute;top:0;width:' + colW + 'px';
          wrap.appendChild(strip);

          [0, 1].forEach(function() {
            colSrcs.forEach(function(src) {
              var img = document.createElement('img');
              img.src = base + '/' + src;
              img.style.cssText = 'display:block;width:' + colW + 'px;height:auto;margin-bottom:' + GAP2 + 'px';
              strip.appendChild(img);
            });
          });

          return { el: strip, offset: c * 300 };
        });

        var userScrolling = false;
        var resumeTimer = null;

        // single wheel listener on the whole panel — moves both columns
        panel.addEventListener('wheel', function(e) {
          e.preventDefault();
          strips.forEach(function(s) {
            s.offset += e.deltaY * 0.5;
            var half = s.el.scrollHeight / 2;
            if (half) s.offset = ((s.offset % half) + half) % half;
            s.el.style.top = -s.offset + 'px';
          });
          userScrolling = true;
          clearTimeout(resumeTimer);
          resumeTimer = setTimeout(function() { userScrolling = false; }, 1500);
        }, { passive: false });

        function tick(now) {
          requestAnimationFrame(tick);
          if (now - lastT < 33) return;
          lastT = now;
          if (userScrolling) return;
          strips.forEach(function(s) {
            var half = s.el.scrollHeight / 2;
            if (!half) return;
            s.offset = (s.offset + SPEED) % half;
            s.el.style.top = -s.offset + 'px';
          });
        }
        requestAnimationFrame(tick);
      }
    })();
  </script>

  <audio id="bg-music" loop preload="auto"></audio>
  <script>
    (function() {
      var music = document.getElementById('bg-music');
      music.volume = 0.35;
      var started = false;
      var tracks  = [];

      onContent(function(d) { tracks = d._music || []; });

      function play() {
        if (started || !tracks.length) return;
        started = true;
        music.src = base + '/' + tracks[Math.floor(Math.random() * tracks.length)];
        music.play().catch(function() {});
        document.removeEventListener('click', play);
        document.removeEventListener('keydown', play);
      }

      document.addEventListener('click', play);
      document.addEventListener('keydown', play);
    })();
  </script>e
</body>
</html>
