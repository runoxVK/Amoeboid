<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMOEBOID</title>
  <link rel="preload" href="assets/fonts/Bombardier-Regular.ttf" as="font" type="font/ttf" crossorigin="anonymous">
  <link rel="preload" href="assets/sounds/vomit.mp3" as="audio">
  <link rel="preload" href="assets/sounds/digestion.mp3" as="audio">
  <link rel="preload" href="assets/sounds/consumption.mp3" as="audio">
  <link rel="preload" href="assets/sounds/click.mp3" as="audio">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette"  aria-hidden="true"></div>

  <div class="layout">

    <!-- LEFT: slab monitor -->
    <div class="slab-wrap">
      <div class="slab">

        <div class="slab-bar slab-bar-top">
          <div class="rivet"></div>
          <div class="rivet"></div>
          <div class="slab-label">AMOEBOID — MK.I</div>
          <div class="rivet"></div>
          <div class="rivet"></div>
        </div>

        <div class="slab-body">
          <div class="slab-col">
            <div class="rivet"></div>
            <div class="rivet"></div>
            <div class="rivet"></div>
            <div class="rivet"></div>
          </div>

          <div class="slab-screen-well">
            <div class="slab-screen-inner">
              <div class="screen-flicker" aria-hidden="true"></div>
              <div id="terminal-viewport">
                <div class="terminal-output" id="output" aria-live="polite"></div>
              </div>
              <div class="terminal-input-row" id="input-row" style="display:none;">
                <span class="prompt" aria-hidden="true">runox@amoeboid:~$&nbsp;</span>
                <input
                  type="text"
                  id="cmd-input"
                  class="cmd-input"
                  autocomplete="off"
                  autocorrect="off"
                  autocapitalize="off"
                  spellcheck="false"
                  aria-label="Terminal input"
                />
              </div>
            </div>
          </div>

          <div class="slab-col">
            <div class="rivet"></div>
            <div class="rivet"></div>
            <div class="rivet"></div>
            <div class="rivet"></div>
          </div>
        </div>

        <div class="slab-bar slab-bar-bottom">
          <div class="rivet"></div>
          <div class="rivet"></div>
          <div class="slab-scratches" aria-hidden="true"></div>
          <div class="rivet"></div>
          <div class="rivet"></div>
        </div>

      </div>
    </div>

    <!-- RIGHT: image panel -->
    <div class="right-panel" id="right-panel"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js" defer></script>
  <script src="terminal.js" defer></script>

  <script>
    window.scrollTo = function() {
      var vp = document.getElementById('terminal-viewport');
      if (vp) vp.scrollTop = vp.scrollHeight;
    };
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.retro-window') && !e.target.closest('.entry-card')) {
        var inp = document.getElementById('cmd-input');
        if (inp) inp.focus();
      }
    });
    /* ── Marquee ── */
    (function() {
      var base  = location.pathname.replace(/\/[^/]*$/, '').replace(/\/$/, '');
      var GAP   = 8;
      var SPEED = 0.5;

      fetch(base + '/content.json')
        .then(function(r) { return r.json(); })
        .then(function(d) { build(d._panelImages || []); })
        .catch(function() {});

      function build(srcs) {
        if (!srcs.length) return;
        var panel = document.getElementById('right-panel');
        var colW  = Math.floor((panel.clientWidth - GAP * 3) / 2);
        var cols  = [[], []];
        srcs.forEach(function(s, i) { cols[i % 2].push(s); });

        var strips = cols.map(function(colSrcs, c) {
          var wrap = document.createElement('div');
          wrap.style.cssText = 'position:absolute;top:0;bottom:0;overflow:hidden;left:' + (GAP + c*(colW+GAP)) + 'px;width:' + colW + 'px';
          panel.appendChild(wrap);

          var strip = document.createElement('div');
          strip.style.cssText = 'position:absolute;top:0;width:' + colW + 'px';
          wrap.appendChild(strip);

          [0, 1].forEach(function() {
            colSrcs.forEach(function(src) {
              var img = document.createElement('img');
              img.src = base + '/' + src;
              img.style.cssText = 'display:block;width:' + colW + 'px;height:auto;margin-bottom:' + GAP + 'px';
              strip.appendChild(img);
            });
          });

          return { el: strip, offset: c * 300 };
        });

        function tick() {
          requestAnimationFrame(tick);
          strips.forEach(function(s) {
            var half = s.el.scrollHeight / 2;
            if (!half) return;
            s.offset = (s.offset + SPEED) % half;
            s.el.style.top = -s.offset + 'px';
          });
        }
        tick();
      }
    })();
  </script>
</body>
</html>
