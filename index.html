<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REQUIEM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette"  aria-hidden="true"></div>

  <div class="terminal" id="terminal">
    <div class="terminal-output" id="output" aria-live="polite"></div>
    <div class="terminal-input-row" id="input-row" style="display:none;">
      <span class="prompt" aria-hidden="true">runox@requiem:~$&nbsp;</span>
      <input
        type="text"
        id="cmd-input"
        class="cmd-input"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Terminal input"
      />
    </div>
  </div>

  <script src="terminal.js"></script>
</body>
</html>
