<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMOEBOID</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="assets/fonts/Bombardier-Regular.ttf" as="font" type="font/ttf" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- CRT wave filter -->
  <svg id="crt-filter" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="crt-wave" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.0 0.08"
          numOctaves="1"
          seed="2"
          result="noise">
        </feTurbulence>
        <feDisplacementMap
          in="SourceGraphic"
          in2="noise"
          scale="3"
          xChannelSelector="R"
          yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette"  aria-hidden="true"></div>

  <div class="layout">

    <!-- LEFT: slab monitor -->
    <div class="slab-wrap">
      <div class="slab">

        <div class="slab-bar slab-bar-top">
          <div class="rivet"></div>
          <div class="rivet"></div>
          <div class="slab-label">AMOEBOID — MK.I</div>
          <div class="rivet"></div>
          <div class="rivet"></div>
        </div>

        <div class="slab-body">
          <div class="slab-col">
            <div class="rivet"></div>
            <div class="rivet"></div>
            <div class="rivet"></div>
            <div class="rivet"></div>
          </div>

          <div class="slab-screen-well">
            <div class="slab-screen-inner">
              <canvas id="creature-canvas"></canvas>
              <div class="screen-flicker" aria-hidden="true"></div>
              <div id="terminal-viewport">
                <div class="terminal-output" id="output" aria-live="polite"></div>
              </div>
              <div class="terminal-input-row" id="input-row" style="display:none;">
                <span class="prompt" aria-hidden="true">runox@amoeboid:~$&nbsp;</span>
                <input
                  type="text"
                  id="cmd-input"
                  class="cmd-input"
                  autocomplete="off"
                  autocorrect="off"
                  autocapitalize="off"
                  spellcheck="false"
                  aria-label="Terminal input"
                />
              </div>
            </div>
          </div>

          <div class="slab-col">
            <div class="rivet"></div>
            <div class="rivet"></div>
            <div class="rivet"></div>
            <div class="rivet"></div>
          </div>
        </div>

        <div class="slab-bar slab-bar-bottom">
          <div class="rivet"></div>
          <div class="rivet"></div>
          <div class="slab-scratches" aria-hidden="true"></div>
          <div class="rivet"></div>
          <div class="rivet"></div>
        </div>

      </div>
    </div>

    <!-- RIGHT: image panel -->
    <div class="right-panel" id="right-panel"></div>

  </div>

  <script src="assets/marked.min.js" defer></script>
  <script src="terminal.js" defer></script>

  <script>
    window.scrollTo = function() {
      var vp = document.getElementById('terminal-viewport');
      if (vp) vp.scrollTop = vp.scrollHeight;
    };
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.retro-window') && !e.target.closest('.entry-card')) {
        var inp = document.getElementById('cmd-input');
        if (inp) inp.focus();
      }
    });

    /* ── Single fetch — shared by marquee and music ── */
    var base = location.pathname.replace(/\/[^/]*$/, '').replace(/\/$/, '');
    var _contentData = null;
    var _contentCallbacks = [];
    fetch(base + '/content.json')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        _contentData = d;
        _contentCallbacks.forEach(function(cb) { cb(d); });
        _contentCallbacks = [];
      })
      .catch(function() { _contentData = {}; });

    function onContent(cb) {
      if (_contentData) cb(_contentData);
      else _contentCallbacks.push(cb);
    }

    /* ── Marquee ── */
    (function() {
      var GAP   = 8;
      var SPEED = 0.5;
      var lastT = 0;

      onContent(function(d) { build(d._panelImages || []); });

      function build(srcs) {
        if (!srcs.length) return;
        var panel = document.getElementById('right-panel');
        var GAP2  = 6;
        var colW  = Math.floor((panel.clientWidth - GAP2 * 3) / 2);
        var cols  = [[], []];
        srcs.forEach(function(s, i) { cols[i % 2].push(s); });

        var strips = cols.map(function(colSrcs, c) {
          var wrap = document.createElement('div');
          wrap.style.cssText = 'position:absolute;top:0;bottom:0;overflow:hidden;left:' + (GAP2 + c*(colW+GAP2)) + 'px;width:' + colW + 'px';
          panel.appendChild(wrap);

          var strip = document.createElement('div');
          strip.style.cssText = 'position:absolute;top:0;width:' + colW + 'px';
          wrap.appendChild(strip);

          [0, 1].forEach(function() {
            colSrcs.forEach(function(src) {
              var img = document.createElement('img');
              img.src = base + '/' + src;
              img.style.cssText = 'display:block;width:' + colW + 'px;height:auto;margin-bottom:' + GAP2 + 'px';
              strip.appendChild(img);
            });
          });

          return { el: strip, offset: c * 300 };
        });

        var userScrolling = false;
        var resumeTimer = null;

        // single wheel listener on the whole panel — moves both columns
        panel.addEventListener('wheel', function(e) {
          e.preventDefault();
          strips.forEach(function(s) {
            s.offset += e.deltaY * 0.5;
            var half = s.el.scrollHeight / 2;
            if (half) s.offset = ((s.offset % half) + half) % half;
            s.el.style.top = -s.offset + 'px';
          });
          userScrolling = true;
          clearTimeout(resumeTimer);
          resumeTimer = setTimeout(function() { userScrolling = false; }, 1500);
        }, { passive: false });

        function tick(now) {
          requestAnimationFrame(tick);
          if (now - lastT < 33) return;
          lastT = now;
          if (userScrolling) return;
          strips.forEach(function(s) {
            var half = s.el.scrollHeight / 2;
            if (!half) return;
            s.offset = (s.offset + SPEED) % half;
            s.el.style.top = -s.offset + 'px';
          });
        }
        requestAnimationFrame(tick);
      }
    })();
  </script>

  <!-- Kelp creature -->
  <script>
  (function() {
    var canvas = document.getElementById('creature-canvas');
    var ctx    = canvas.getContext('2d');
    var W, H;

    var NUM_SEGS = 32;
    var SEG_LEN  = 12;
    var HEAD_R   = 8;
    var TAIL_R   = 1.5;

    var segs = [];
    var hx, hy;
    // start with a real velocity so it moves immediately
    var hvx = 1.2, hvy = 0.8;
    var time = 0;

    // heading angle for smooth turning
    var angle = Math.random() * Math.PI * 2;
    var targetAngle = angle;

    function resize() {
      var screen = canvas.parentElement;
      W = canvas.width  = screen.clientWidth  || 400;
      H = canvas.height = screen.clientHeight || 600;
      if (!hx) { hx = W * 0.5; hy = H * 0.4; }
      if (!segs.length) {
        segs = [];
        for (var i = 0; i < NUM_SEGS; i++)
          segs.push({ x: hx - Math.cos(angle)*i*SEG_LEN, y: hy - Math.sin(angle)*i*SEG_LEN });
      }
    }

    var lastC = 0;
    function tick(now) {
      requestAnimationFrame(tick);
      if (now - lastC < 33) return;
      lastC = now;
      time += 0.033;
      W = canvas.width; H = canvas.height;

      // smoothly steer toward a wandering target angle
      targetAngle += (Math.random() - 0.5) * 0.18;
      // angle difference — wrap properly
      var diff = targetAngle - angle;
      while (diff >  Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      angle += diff * 0.08; // how fast it turns — higher = snappier

      // speed with slight variation
      var speed = 1.6 + Math.sin(time * 1.3) * 0.4;
      hvx = Math.cos(angle) * speed;
      hvy = Math.sin(angle) * speed;

      hx += hvx;
      hy += hvy;

      // soft bounce — also steer away from walls
      var pad = 50;
      if (hx < pad)   { targetAngle = 0;            hx += (pad-hx)*0.15; }
      if (hx > W-pad) { targetAngle = Math.PI;       hx += (W-pad-hx)*0.15; }
      if (hy < pad)   { targetAngle = Math.PI*0.5;   hy += (pad-hy)*0.15; }
      if (hy > H-pad) { targetAngle = -Math.PI*0.5;  hy += (H-pad-hy)*0.15; }

      // FABRIK chain
      segs[0].x = hx; segs[0].y = hy;
      for (var i = 1; i < NUM_SEGS; i++) {
        var sx = segs[i].x - segs[i-1].x;
        var sy = segs[i].y - segs[i-1].y;
        var d  = Math.sqrt(sx*sx+sy*sy) || 0.001;
        segs[i].x = segs[i-1].x + (sx/d)*SEG_LEN;
        segs[i].y = segs[i-1].y + (sy/d)*SEG_LEN;
      }

      ctx.clearRect(0, 0, W, H);

      for (var i = NUM_SEGS-1; i >= 0; i--) {
        var t   = i / (NUM_SEGS-1);
        var r   = HEAD_R*(1-t) + TAIL_R*t;
        // tighter, faster slither wave
        var wob = Math.sin(time*5 + i*0.45) * r * 0.6;

        var nx = 0, ny = 0;
        if (i < NUM_SEGS-1) {
          var adx = segs[i].x - segs[i+1].x;
          var ady = segs[i].y - segs[i+1].y;
          var al  = Math.sqrt(adx*adx+ady*ady) || 1;
          nx = -ady/al; ny = adx/al;
        }

        var px = segs[i].x + nx*wob;
        var py = segs[i].y + ny*wob;
        var g  = Math.round(90 + (1-t)*110);
        var alp = 0.7 + 0.3*(1-t);

        // glow
        var grd = ctx.createRadialGradient(px,py,0,px,py,r*2);
        grd.addColorStop(0,'rgba(20,'+(g+50)+',40,'+(0.15*(1-t*0.5))+')');
        grd.addColorStop(1,'rgba(0,0,0,0)');
        ctx.beginPath(); ctx.arc(px,py,r*2,0,Math.PI*2);
        ctx.fillStyle = grd; ctx.fill();

        // body
        ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2);
        ctx.fillStyle = 'rgba(8,'+g+',18,'+alp+')'; ctx.fill();

        // rim
        ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2);
        ctx.strokeStyle = 'rgba(64,255,96,'+(0.22*(1-t))+')';
        ctx.lineWidth = 0.7; ctx.stroke();

        // eyes on head
        if (i === 0) {
          var er = r*0.22;
          [1,-1].forEach(function(s) {
            ctx.beginPath();
            ctx.arc(px+nx*r*0.4*s, py+ny*r*0.4*s, er, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(190,255,200,0.95)'; ctx.fill();
            ctx.beginPath();
            ctx.arc(px+nx*r*0.4*s, py+ny*r*0.4*s, er*0.4, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(0,15,0,0.95)'; ctx.fill();
          });
        }
      }
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(tick);
  })();
  </script>

  <audio id="bg-music" loop preload="auto"></audio>
  <script>
    (function() {
      var music = document.getElementById('bg-music');
      music.volume = 0.35;
      var started = false;
      var tracks  = [];

      onContent(function(d) { tracks = d._music || []; });

      function play() {
        if (started || !tracks.length) return;
        started = true;
        music.src = base + '/' + tracks[Math.floor(Math.random() * tracks.length)];
        music.play().catch(function() {});
        document.removeEventListener('click', play);
        document.removeEventListener('keydown', play);
      }

      document.addEventListener('click', play);
      document.addEventListener('keydown', play);
    })();
  </script>
</body>
</html>
