<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMOEBOID</title>
  <link rel="preload" href="assets/fonts/Bombardier-Regular.ttf" as="font" type="font/ttf" crossorigin="anonymous">
  <link rel="preload" href="assets/sounds/vomit.mp3" as="audio">
  <link rel="preload" href="assets/sounds/digestion.mp3" as="audio">
  <link rel="preload" href="assets/sounds/consumption.mp3" as="audio">
  <link rel="preload" href="assets/sounds/click.mp3" as="audio">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- CRT wave filter -->
  <svg id="crt-filter" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="crt-wave" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.0 0.08"
          numOctaves="1"
          seed="2"
          result="noise">
          <animate attributeName="baseFrequency"
            values="0.0 0.08;0.0 0.085;0.0 0.08"
            dur="6s" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap
          in="SourceGraphic"
          in2="noise"
          scale="3"
          xChannelSelector="R"
          yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette"  aria-hidden="true"></div>

  <div class="layout">

    <!-- LEFT: slab monitor -->
    <div class="slab-wrap">
      <div class="slab">

        <div class="slab-bar slab-bar-top">
          <div class="rivet"></div>
          <div class="rivet"></div>
          <div class="slab-label">AMOEBOID — MK.I</div>
          <div class="rivet"></div>
          <div class="rivet"></div>
        </div>

        <div class="slab-body">
          <div class="slab-col">
            <div class="rivet"></div>
            <div class="rivet"></div>
            <div class="rivet"></div>
            <div class="rivet"></div>
          </div>

          <div class="slab-screen-well">
            <div class="slab-screen-inner">
              <canvas id="creature-canvas"></canvas>
              <div class="screen-flicker" aria-hidden="true"></div>
              <div id="terminal-viewport">
                <div class="terminal-output" id="output" aria-live="polite"></div>
              </div>
              <div class="terminal-input-row" id="input-row" style="display:none;">
                <span class="prompt" aria-hidden="true">runox@amoeboid:~$&nbsp;</span>
                <input
                  type="text"
                  id="cmd-input"
                  class="cmd-input"
                  autocomplete="off"
                  autocorrect="off"
                  autocapitalize="off"
                  spellcheck="false"
                  aria-label="Terminal input"
                />
              </div>
            </div>
          </div>

          <div class="slab-col">
            <div class="rivet"></div>
            <div class="rivet"></div>
            <div class="rivet"></div>
            <div class="rivet"></div>
          </div>
        </div>

        <div class="slab-bar slab-bar-bottom">
          <div class="rivet"></div>
          <div class="rivet"></div>
          <div class="slab-scratches" aria-hidden="true"></div>
          <div class="rivet"></div>
          <div class="rivet"></div>
        </div>

      </div>
    </div>

    <!-- RIGHT: image panel -->
    <div class="right-panel" id="right-panel"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js" defer></script>
  <script src="terminal.js" defer></script>

  <script>
    window.scrollTo = function() {
      var vp = document.getElementById('terminal-viewport');
      if (vp) vp.scrollTop = vp.scrollHeight;
    };
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.retro-window') && !e.target.closest('.entry-card')) {
        var inp = document.getElementById('cmd-input');
        if (inp) inp.focus();
      }
    });
    /* ── Marquee ── */
    (function() {
      var base  = location.pathname.replace(/\/[^/]*$/, '').replace(/\/$/, '');
      var GAP   = 8;
      var SPEED = 0.5;

      fetch(base + '/content.json')
        .then(function(r) { return r.json(); })
        .then(function(d) { build(d._panelImages || []); })
        .catch(function() {});

      function build(srcs) {
        if (!srcs.length) return;
        var panel = document.getElementById('right-panel');
        var colW  = Math.floor((panel.clientWidth - GAP * 3) / 2);
        var cols  = [[], []];
        srcs.forEach(function(s, i) { cols[i % 2].push(s); });

        var strips = cols.map(function(colSrcs, c) {
          var wrap = document.createElement('div');
          wrap.style.cssText = 'position:absolute;top:0;bottom:0;overflow:hidden;left:' + (GAP + c*(colW+GAP)) + 'px;width:' + colW + 'px';
          panel.appendChild(wrap);

          var strip = document.createElement('div');
          strip.style.cssText = 'position:absolute;top:0;width:' + colW + 'px';
          wrap.appendChild(strip);

          [0, 1].forEach(function() {
            colSrcs.forEach(function(src) {
              var img = document.createElement('img');
              img.src = base + '/' + src;
              img.style.cssText = 'display:block;width:' + colW + 'px;height:auto;margin-bottom:' + GAP + 'px';
              strip.appendChild(img);
            });
          });

          return { el: strip, offset: c * 300 };
        });

        function tick() {
          requestAnimationFrame(tick);
          strips.forEach(function(s) {
            var half = s.el.scrollHeight / 2;
            if (!half) return;
            s.offset = (s.offset + SPEED) % half;
            s.el.style.top = -s.offset + 'px';
          });
        }
        tick();
      }
    })();
  </script>

  <!-- Kelp creature -->
  <script>
  (function() {
    var canvas = document.getElementById('creature-canvas');
    var ctx    = canvas.getContext('2d');
    var W, H;

    var NUM_SEGS = 24;
    var SEG_LEN  = 17;
    var HEAD_R   = 11;
    var TAIL_R   = 2.5;

    var segs = [];
    var hx, hy, hvx = 0.6, hvy = 0.3;
    var time = 0;

    function resize() {
      var screen = canvas.parentElement;
      W = canvas.width  = screen.clientWidth  || 400;
      H = canvas.height = screen.clientHeight || 600;
      if (!hx) { hx = W * 0.5; hy = H * 0.5; }
      if (!segs.length) {
        segs = [];
        for (var i = 0; i < NUM_SEGS; i++)
          segs.push({ x: hx, y: hy + i * SEG_LEN });
      }
    }

    function tick() {
      requestAnimationFrame(tick);
      time += 0.016;
      W = canvas.width; H = canvas.height;

      // two overlapping sine waves drive the head
      hvx += Math.sin(time * 0.55) * 0.18 + Math.sin(time * 1.1 + 1.2) * 0.07;
      hvy += Math.sin(time * 0.38 + 2.0) * 0.11 + Math.sin(time * 0.85 + 0.5) * 0.05;

      hvx *= 0.91; hvy *= 0.91;
      var spd = Math.sqrt(hvx*hvx + hvy*hvy);
      if (spd > 1.7) { hvx = hvx/spd*1.7; hvy = hvy/spd*1.7; }

      hx += hvx; hy += hvy;

      // soft bounce off all four edges
      var pad = 60;
      if (hx < pad)     { hx += (pad-hx)*0.12;     hvx *= 0.5; }
      if (hx > W-pad)   { hx += (W-pad-hx)*0.12;   hvx *= 0.5; }
      if (hy < pad)     { hy += (pad-hy)*0.12;      hvy *= 0.5; }
      if (hy > H-pad)   { hy += (H-pad-hy)*0.12;    hvy *= 0.5; }

      // pure forward FABRIK — no anchor, tail just follows
      segs[0].x = hx; segs[0].y = hy;
      for (var i = 1; i < NUM_SEGS; i++) {
        var sx = segs[i].x - segs[i-1].x;
        var sy = segs[i].y - segs[i-1].y;
        var d  = Math.sqrt(sx*sx+sy*sy) || 0.001;
        segs[i].x = segs[i-1].x + (sx/d)*SEG_LEN;
        segs[i].y = segs[i-1].y + (sy/d)*SEG_LEN;
      }

      // draw
      ctx.clearRect(0, 0, W, H);

      for (var i = NUM_SEGS-1; i >= 0; i--) {
        var t   = i / (NUM_SEGS-1);
        var r   = HEAD_R*(1-t) + TAIL_R*t;
        var wob = Math.sin(time*2.4 + i*0.6) * (4 + (1-t)*4);

        var nx = 0, ny = 0;
        if (i < NUM_SEGS-1) {
          var adx = segs[i].x - segs[i+1].x;
          var ady = segs[i].y - segs[i+1].y;
          var al  = Math.sqrt(adx*adx+ady*ady) || 1;
          nx = -ady/al; ny = adx/al;
        }

        var px = segs[i].x + nx*wob;
        var py = segs[i].y + ny*wob;
        var g  = Math.round(90 + (1-t)*110);
        var alp = 0.55 + 0.4*(1-t);

        var grd = ctx.createRadialGradient(px,py,0,px,py,r*2.2);
        grd.addColorStop(0,'rgba(20,'+(g+50)+',40,'+(0.13*(1-t*0.4))+')');
        grd.addColorStop(1,'rgba(0,0,0,0)');
        ctx.beginPath(); ctx.arc(px,py,r*2.2,0,Math.PI*2);
        ctx.fillStyle = grd; ctx.fill();

        ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2);
        ctx.fillStyle = 'rgba(8,'+g+',18,'+alp+')'; ctx.fill();

        ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2);
        ctx.strokeStyle = 'rgba(64,255,96,'+(0.18*(1-t))+')';
        ctx.lineWidth = 0.8; ctx.stroke();

        if (i === 0) {
          var er = r*0.2;
          [1,-1].forEach(function(s) {
            ctx.beginPath();
            ctx.arc(px+nx*r*0.38*s, py+ny*r*0.38*s, er, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(190,255,200,0.9)'; ctx.fill();
            ctx.beginPath();
            ctx.arc(px+nx*r*0.38*s, py+ny*r*0.38*s, er*0.45, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(0,15,0,0.95)'; ctx.fill();
          });
        }
      }
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(tick);
  })();
  </script>

</body>
</html>
