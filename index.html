<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMOEBOID</title>
  <!-- preload font so it doesn't block first paint -->
  <link rel="preload" href="assets/fonts/Bombardier-Regular.ttf" as="font" type="font/ttf" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="star-canvas" aria-hidden="true"></canvas>

  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette"  aria-hidden="true"></div>

  <div class="layout">

    <!-- LEFT: slab monitor -->
    <div class="slab-wrap">
      <div class="slab">

        <div class="slab-bar slab-bar-top">
          <div class="rivet"></div>
          <div class="rivet"></div>
          <div class="slab-label">AMOEBOID — MK.I</div>
          <div class="rivet"></div>
          <div class="rivet"></div>
        </div>

        <div class="slab-body">
          <div class="slab-col">
            <div class="rivet"></div>
            <div class="rivet"></div>
            <div class="rivet"></div>
            <div class="rivet"></div>
          </div>

          <div class="slab-screen-well">
            <div class="slab-screen-inner">
              <canvas id="canvas" aria-hidden="true"></canvas>
              <div class="screen-flicker" aria-hidden="true"></div>
              <div id="terminal-viewport">
                <div class="terminal-output" id="output" aria-live="polite"></div>
              </div>
              <div class="terminal-input-row" id="input-row" style="display:none;">
                <span class="prompt" aria-hidden="true">runox@amoeboid:~$&nbsp;</span>
                <input
                  type="text"
                  id="cmd-input"
                  class="cmd-input"
                  autocomplete="off"
                  autocorrect="off"
                  autocapitalize="off"
                  spellcheck="false"
                  aria-label="Terminal input"
                />
              </div>
            </div>
          </div>

          <div class="slab-col">
            <div class="rivet"></div>
            <div class="rivet"></div>
            <div class="rivet"></div>
            <div class="rivet"></div>
          </div>
        </div>

        <div class="slab-bar slab-bar-bottom">
          <div class="rivet"></div>
          <div class="rivet"></div>
          <div class="slab-scratches" aria-hidden="true"></div>
          <div class="rivet"></div>
          <div class="rivet"></div>
        </div>

      </div>
    </div>

    <!-- RIGHT: image panel — populated dynamically from assets/panel-images/ -->
    <div class="right-panel" id="right-panel"></div>

  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
  <script defer src="terminal.js"></script>

  <script>
    /* ── Static star background — drawn once, no animation ── */
    (function() {
      var sc  = document.getElementById('star-canvas');
      var sctx = sc.getContext('2d');
      function drawStars() {
        sc.width  = window.innerWidth;
        sc.height = window.innerHeight;
        sctx.clearRect(0, 0, sc.width, sc.height);
        var layers = [
          { count: 250, size: 1,   alpha: 0.4, color: '138,216,224' },
          { count: 120, size: 1.5, alpha: 0.55, color: '74,154,170' },
          { count: 50,  size: 2.5, alpha: 0.7,  color: '74,232,224' },
        ];
        layers.forEach(function(l) {
          for (var i = 0; i < l.count; i++) {
            var x = Math.random() * sc.width;
            var y = Math.random() * sc.height;
            sctx.beginPath();
            sctx.arc(x, y, l.size, 0, Math.PI * 2);
            sctx.fillStyle = 'rgba(' + l.color + ',' + l.alpha + ')';
            sctx.fill();
          }
        });
      }
      drawStars();
      window.addEventListener('resize', drawStars);
    })();

    /* ── Flow field — inside screen, heavily throttled ── */
    var flowCanvas, flowCtx, field, fw, fh, size, columns, rows, zoom;
    var noiseObj;

    function setupFlow() {
      noiseObj = new SimplexNoise();
      size = 32;
      flowCanvas = document.querySelector('#canvas');
      if (!flowCanvas) return;
      flowCtx = flowCanvas.getContext('2d');
      resetFlow();
      window.addEventListener('resize', function() { setTimeout(resetFlow, 300); });
    }
    function resetFlow() {
      if (!flowCanvas) return;
      zoom = Math.random() * 90 + 20;
      var screen = flowCanvas.parentElement;
      fw = flowCanvas.width  = screen ? screen.clientWidth  : 400;
      fh = flowCanvas.height = screen ? screen.clientHeight : 600;
      columns = Math.floor(fw / size) + 2;
      rows    = Math.floor(fh / size) + 2;
      field = [];
      for (var x = 0; x < columns; x++) {
        field[x] = [];
        for (var y = 0; y < rows; y++) field[x][y] = 0;
      }
    }
    var lastFlow = 0;
    function drawFlow(now) {
      requestAnimationFrame(drawFlow);
      if (now - lastFlow < 80) return; // ~12fps — enough for subtle movement
      lastFlow = now;
      if (!flowCtx) return;
      for (var x = 0; x < columns; x++)
        for (var y = 0; y < rows; y++)
          field[x][y] = noiseObj.noise3D(x/zoom, y/zoom, now/3000) * Math.PI * 2;
      flowCtx.fillStyle = 'rgba(0,0,0,0.3)';
      flowCtx.fillRect(0, 0, fw, fh);
      flowCtx.strokeStyle = 'rgba(42,192,200,0.07)';
      flowCtx.lineWidth = 1;
      for (var x = 0; x < columns; x++) {
        for (var y = 0; y < rows; y++) {
          var angle = field[x][y];
          var x1 = x * size, y1 = y * size;
          flowCtx.beginPath();
          flowCtx.moveTo(x1, y1);
          flowCtx.lineTo(x1 + Math.cos(angle)*size*1.2, y1 + Math.sin(angle)*size*1.2);
          flowCtx.stroke();
        }
      }
    }
    setupFlow();
    window.addEventListener('load', function() {
      setTimeout(function() { requestAnimationFrame(drawFlow); }, 2000);
    });

    /* ── Terminal scroll redirect ── */
    window.scrollTo = function() {
      var vp = document.getElementById('terminal-viewport');
      if (vp) vp.scrollTop = vp.scrollHeight;
    };
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.retro-window') && !e.target.closest('.entry-card')) {
        var inp = document.getElementById('cmd-input');
        if (inp) inp.focus();
      }
    });

    /* ── Panel images: 2-column vertical marquee ── */
    (function() {
      var base  = location.pathname.replace(/\/[^/]*$/, '').replace(/\/$/, '');
      var GAP   = 8;    // px gap between images and columns
      var SPEED = 0.5;  // px per frame
      var raf   = null;

      function loadMarquee() {
        fetch(base + '/content.json')
          .then(function(r) { return r.json(); })
          .then(function(data) { preload(data._panelImages || []); })
          .catch(function() {});
      }

      function preload(srcs) {
        if (!srcs.length) return;
        var items  = srcs.map(function(src) { return { src: src, ratio: 1 }; });
        var loaded = 0;
        srcs.forEach(function(src, i) {
          var p = new Image();
          p.onload = function() {
            items[i].ratio = p.naturalHeight / (p.naturalWidth || 1);
            if (++loaded === srcs.length) build(items);
          };
          p.onerror = function() { if (++loaded === srcs.length) build(items); };
          p.src = base + '/' + src;
        });
      }

      function build(items) {
        var panel = document.getElementById('right-panel');
        if (!panel) return;
        panel.innerHTML = '';
        if (raf) cancelAnimationFrame(raf);

        var cols   = 2;
        var colW   = Math.floor((panel.clientWidth - GAP * (cols + 1)) / cols);

        // assign images to columns (shortest first)
        var colItems = [[], []];
        var colH     = [0, 0];
        items.forEach(function(it) {
          var c = colH[1] < colH[0] ? 1 : 0;
          var h = Math.round(colW * it.ratio);
          colItems[c].push({ src: it.src, h: h });
          colH[c] += h + GAP;
        });

        // build a strip for each column, duplicated for seamless loop
        var strips = [];
        for (var c = 0; c < cols; c++) {
          var x     = GAP + c * (colW + GAP);
          var strip = document.createElement('div');
          strip.style.cssText = 'position:absolute;top:0;left:' + x + 'px;width:' + colW + 'px;will-change:transform;';

          var stripH = colItems[c].reduce(function(s, it) { return s + it.h + GAP; }, 0);

          // append twice
          [0, 1].forEach(function() {
            colItems[c].forEach(function(it) {
              var img = document.createElement('img');
              img.src = base + '/' + it.src;
              img.className = 'panel-img';
              img.style.cssText = [
                'display:block',
                'width:'  + colW + 'px',
                'height:' + it.h  + 'px',
                'object-fit:cover',
                'margin-bottom:' + GAP + 'px',
                'position:static'
              ].join(';');
              strip.appendChild(img);
            });
          });

          panel.appendChild(strip);
          strips.push({ el: strip, totalH: stripH, offset: 0 });
        }

        // stagger col 1 so columns aren't in sync
        strips[1].offset = strips[1].totalH * 0.4;

        function tick() {
          raf = requestAnimationFrame(tick);
          strips.forEach(function(s) {
            s.offset += SPEED;
            if (s.offset >= s.totalH) s.offset -= s.totalH;
            s.el.style.transform = 'translateY(' + (-s.offset).toFixed(1) + 'px)';
          });
        }
        tick();
      }

      window.addEventListener('load', loadMarquee);
      if (document.readyState === 'complete') loadMarquee();
    })();
  </script>
</body>
</html>
