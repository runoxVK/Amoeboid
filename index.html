<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMOEBOID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette"  aria-hidden="true"></div>

  <div class="terminal" id="terminal">
    <div class="terminal-output" id="output" aria-live="polite"></div>
    <div class="terminal-input-row" id="input-row" style="display:none;">
      <span class="prompt" aria-hidden="true">runox@amoeboid:~$&nbsp;</span>
      <input
        type="text"
        id="cmd-input"
        class="cmd-input"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Terminal input"
      />
    </div>
  </div>

  <div id="viewer" style="display:none; position:fixed; inset:0; z-index:200; background:#080b08; flex-direction:column;">
    <div style="display:flex; align-items:center; justify-content:space-between; padding:0.75rem 2rem; border-bottom:1px solid rgba(168,255,120,0.12); background:#0e120e; flex-shrink:0;">
      <span id="viewer-title" style="font-family:'IBM Plex Mono',monospace; font-size:12px; color:#6bc24e; letter-spacing:0.08em;"></span>
      <button id="viewer-close" style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:#6a8a6a; background:transparent; border:1px solid rgba(168,255,120,0.15); padding:4px 12px; border-radius:2px; cursor:pointer; letter-spacing:0.06em;">esc / close</button>
    </div>
    <div id="viewer-body" style="flex:1; overflow-y:auto; padding:2rem; max-width:820px; width:100%; margin:0 auto;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
